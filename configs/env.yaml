# Text-embedding model registry. One model per line: "<name> <dim> <source> [loader]".
#   name   = short id used everywhere (--emb, checkpoint paths, text_embeddings/<name>.*)
#   source = HuggingFace repo id, loaded with SentenceTransformer
#   loader = optional; 'cls' selects the dedicated BERT [CLS] loader instead
embedding_models:
  - bert-base    768   bert-base-uncased        cls
  - mpnet-base   768   all-mpnet-base-v2
  - qwen3-4b     2560  Qwen/Qwen3-Embedding-4B

# Filesystem locations for EEG data (edit here if your mounts differ).
paths:
  raw_data:   /media/public/EEG_Dataset      # source datasets, read by the leaf_datasets/*.py builders
  pretrain:   /media/public/LEAF/Pretrain    # pretraining .npy trials
  downstream: /media/public/LEAF/Downstream  # processed per-dataset .h5 files
