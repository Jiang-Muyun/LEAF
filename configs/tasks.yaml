datasets:
  MI_OpenBMI:        [Right, Left]
  MI_BCIC_IV2a:      [Left, Right, Foot, Tongue]
  MI_ShanghaiU:      [Right, Left]
  MI_BCIC_Upperlimb: [Cylin, Sphe, Lumbrical]
  MI_HighGamma:      [Left, Right]
  MI_Cho2017:        [Left, Right]
  MI_Shin2017A:      [Left, Right]
  MI_PhysioNet:      [Left, Right]

  EMO_FACED:         [Anger, Fear, Disgust, Sad, Amusement, Inspiration, Joy, Tenderness, Neutral]
  EMO_SEED_3_seg4:   [Negative, Neutral, Positive]
  EMO_SEED_4_seg4:   [Neutral, Sad, Fear, Happy]
  EMO_SEED_5_seg4:   [Disgust, Fear, Sad, Neutral, Happy]
  EMO_SEED_7_seg4:   [Happy, Surprise, Neutral, Sad, Disgust, Fear, Anger]

  SSVEP_OpenBMI:     ['12.0', '8.6', '6.6', '5.4']
  CS_BCIC_Speech:    [hello, help-me, stop, thank-you, 'yes']
  Workload:          [Resting, Workload]
  ADHD_AliMotie:     [Healthy, ADHD]

# Task family -> list of instruction phrasings.
# ('None' is quoted so YAML keeps it a string rather than parsing it as null.)
instructions:
  Default:
    - 'None'
    - Default

  Motor:
    - This is a motor imagery decoding task
    - Decode motor imagery
    - Please decode the motor imagery
    - Classify the motor imagery task
    - Identify the motor imagery class
    - Predict the type of imagined movement
    - Determine which motor imagery action is performed
    - Infer the imagined motor action from the EEG
    - Which motor imagery category does this trial belong to
    - Analyze this EEG and classify the motor imagery

  Emotion:
    - This is an emotion recognition task
    - Decode emotional states
    - Please decode the emotional states
    - Identify the emotional state
    - Classify the emotion represented in the signal
    - Predict the emotion category
    - Determine the emotional condition from this EEG
    - Infer the participant emotional state
    - What emotion does this EEG signal reflect
    - Analyze the EEG and classify the emotion

  Speech:
    - This is a covert speech decoding task
    - Decode covert speech
    - Please decode the covert speech commands
    - Identify the covert speech command
    - Classify the imagined speech
    - Predict the covert speech category
    - Determine what the subject is silently saying
    - Infer the intended covert speech command
    - What covert speech does this signal represent
    - Analyze the EEG and classify the covert speech content

  SSVEP:
    - This is an SSVEP frequency decoding task
    - Decode SSVEP frequency
    - Please decode the SSVEP frequency
    - Identify the SSVEP target frequency
    - Classify the evoked frequency response
    - Predict the stimulus frequency from the EEG
    - Determine which frequency the subject was attending to
    - Infer the visual flicker frequency in this trial
    - Analyze the EEG and recognize the SSVEP frequency

  Workload:
    - Decode mental workload states
    - Please decode mental workload states

  ADHD_AliMotie:
    - Decode mental disorder
    - Decode ADHD vs Healthy
    - Please decode ADHD vs Healthy
